name: patrion
description: "Patrion - Investimentos e Patrimônio"
publish_to: 'none'

# SemVer. 0.x até a v1.0.0 (fim da Fase 7).
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# Dependências aprovadas em docs/DECISIONS.md (D-02). Cada uma entra quando
# passa a ser usada.
dependencies:
  clock: ^1.1.3
  decimal: ^3.2.6
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.1
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/patrion-simbolo-256.png
