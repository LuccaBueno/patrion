name: patrion
description: "Patrion - Investimentos e Patrimônio"
publish_to: 'none'

# SemVer (DECISIONS D-38). A tag da Release é "v" + esta versão, sem o "+build".
version: 1.1.0+2

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# Dependências aprovadas em docs/DECISIONS.md (D-02). Cada uma entra quando
# passa a ser usada.
dependencies:
  archive: 4.5.2
  clock: ^1.1.3
  crypto: 3.0.7
  decimal: ^3.2.6
  dio: 5.11.1
  drift: ^2.35.2
  ffi: 2.2.0
  file_picker: 13.1.0
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  local_auth: 3.0.2
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: 4.0.0
  pub_semver: ^2.2.1
  sqlite3: ^3.7.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/patrion-simbolo-256.png
    # Licenças das bibliotecas nativas (SQLCipher e OpenSSL), mostradas em
    # Configurações > Sobre > Licenças de terceiros (DECISIONS D-38).
    - assets/licenses/

# SQLCipher no lugar do SQLite padrão (F5B, DECISIONS D-32).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
