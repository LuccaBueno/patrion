# Release (SPEC §19; DECISIONS D-38 e D-62). Na tag vX.Y.Z: verificação
# completa, instalador, ZIP portátil e somas SHA-256; depois, num job separado
# que espera a aprovação do ambiente "release", assinatura das somas e Release
# em RASCUNHO no GitHub. Tags com -beta ou -rc viram pré-lançamento.
#
# "Run workflow" (workflow_dispatch) faz um ensaio: gera os mesmos arquivos e
# os guarda como artefato do workflow, sem criar Release.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Instalador e ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Versão da tag confere com o pubspec.yaml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $pub = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ($tag -ne "v$pub") { throw "Tag $tag não confere com a versão $pub do pubspec.yaml." }
          Write-Host "Versão $pub"

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test --timeout 2m

      - name: Inno Setup 6
        shell: pwsh
        run: |
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($known | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Build, instalador e ZIP portátil
        shell: pwsh
        run: ./tool/release/build_release.ps1

      - name: Guardar os arquivos (ensaio)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: patrion-release-ensaio
          path: dist/
          retention-days: 7

      - name: Guardar os arquivos para assinar
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: patrion-release
          path: dist/
          retention-days: 1

  # A chave privada só existe aqui, e só no passo que assina. Este job não
  # roda o build nem instala as dependências do app (DECISIONS D-62).
  sign:
    name: Assinatura e Release (rascunho)
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # criar a Release em rascunho
    steps:
      - name: Baixar a ferramenta de assinatura
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tool/signing
            lib/core/config/app_info.dart
          sparse-checkout-cone-mode: false

      - name: Instalar o Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Dependências da assinatura
        working-directory: tool/signing
        run: dart pub get --enforce-lockfile

      - name: Baixar os arquivos da Release
        uses: actions/download-artifact@v7
        with:
          name: patrion-release
          path: dist

      - name: Assinar as somas
        working-directory: tool/signing
        shell: pwsh
        env:
          PATRION_UPDATE_SIGNING_KEY: ${{ secrets.PATRION_UPDATE_SIGNING_KEY }}
        run: |
          dart run bin/sign_file.dart ../../dist/SHA256SUMS.txt ../../lib/core/config/app_info.dart 'patrion ${{ github.ref_name }}'
          if ($LASTEXITCODE -ne 0) { throw 'A assinatura falhou.' }

      - name: Criar a Release em rascunho
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring(1)
          $flags = @('--draft', '--verify-tag', '--title', "Patrion $version", '--notes-file', 'dist/RELEASE_NOTES.md')
          if ($tag -match '-(beta|rc)') { $flags += '--prerelease' }
          gh release create $tag @flags `
            "dist/Patrion-$version-instalador.exe" `
            "dist/Patrion-$version-portatil.zip" `
            'dist/SHA256SUMS.txt' `
            'dist/SHA256SUMS.txt.minisig'
